# Applied to every project automatically by Gradle.
group = dev.shvquu.betternpcs
version = 1.0.0-SNAPSHOT

# Remapping six Paper dev bundles is memory hungry; the default heap is not enough.
org.gradle.jvmargs = -Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

org.gradle.parallel = true
org.gradle.caching = true

# Deliberately NOT enabled yet: paperweight-userdev 2.0.0-beta.x is not verified against the
# configuration cache in this project. Revisit once the six adapters build reliably (see
# docs/adr/0002-multi-version-strategy.md).
org.gradle.configuration-cache = false
