####################################################################################################
# Publishes a release when a version tag is pushed.
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# Produces a GitHub Release carrying the plugin jar and the three API artifacts, and publishes the
# API to GitHub Packages so that third-party plugins can depend on it.
#
# The version comes from the tag, not from gradle.properties. That file holds a -SNAPSHOT version
# for day-to-day work, and a release built from it would be named misleadingly.
####################################################################################################

name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading v (for example 1.0.0)'
        required: true
        type: string

permissions:
  contents: write   # create the release and upload its assets
  packages: write   # publish the API to GitHub Packages

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21 and 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache remapped server jars
        uses: actions/cache@v4
        with:
          path: versions/*/.gradle/caches/paperweight
          key: paperweight-${{ runner.os }}-${{ hashFiles('versions/*/build.gradle.kts') }}
          restore-keys: paperweight-${{ runner.os }}-

      # A tag push gives the version in github.ref_name as "v1.0.0"; a manual run gives it directly.
      #
      # Both arrive through `env:` rather than being interpolated into the script. A `${{ }}`
      # expansion is substituted into the shell source before it runs, so a tag or an input
      # containing shell metacharacters would execute as code on the runner — with a token that can
      # publish packages. The regex below then refuses anything that is not a plain version, so the
      # value is safe to pass to Gradle afterwards.
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          else
            version="${TAG_NAME#v}"
          fi

          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$'; then
            echo "::error::'$version' is not a release version (expected 1.2.3 or 1.2.3-rc1)."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version"

      # The full build, tests included. A release that skipped them would be the one release where
      # it mattered.
      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew build "-Pversion=$VERSION" --stacktrace

      - name: Publish the API to GitHub Packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :api:publish "-Pversion=$VERSION"

      - name: Create the release
        uses: softprops/action-gh-release@v3
        with:
          name: BetterNPCs ${{ steps.version.outputs.version }}
          tag_name: v${{ steps.version.outputs.version }}
          # Written from CHANGELOG.md by hand, then published. Generated notes are added below it so
          # the summary a reader wants comes first and the full commit list is still there.
          generate_release_notes: true
          draft: false
          # A tag carrying a suffix such as v1.0.0-rc1 is a pre-release, and GitHub's "latest"
          # endpoint skips those — which is exactly what the update checker should see.
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          files: |
            plugin/build/libs/BetterNPCs-${{ steps.version.outputs.version }}.jar
            api/build/libs/betternpcs-api-${{ steps.version.outputs.version }}.jar
            api/build/libs/betternpcs-api-${{ steps.version.outputs.version }}-sources.jar
            api/build/libs/betternpcs-api-${{ steps.version.outputs.version }}-javadoc.jar
          fail_on_unmatched_files: true
