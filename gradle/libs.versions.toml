####################################################################################################
# BetterNPCs — central version catalogue.
#
# Every third-party version used anywhere in the build lives here, with one deliberate exception:
# the Paper dev bundle coordinate of each versions/v* module is declared in that module's own build
# script, because it is the single fact that defines what that module *is*.
#
# `buildSrc` reads this same file (see buildSrc/settings.gradle.kts), so the convention plugins and
# the modules can never drift apart.
####################################################################################################

[versions]

# --- Toolchains -----------------------------------------------------------------------------------
# Bytecode target for *every* module. Java 21 class files load on both the Java 21 JVM required by
# Minecraft 1.21.x and the Java 25 JVM required by Minecraft 26.1+.
javaTarget = "21"
# JDK used to compile modules whose compile classpath only contains Java 21 class files.
javaToolchainDefault = "21"
# JDK used to compile the 26.x adapters. Minecraft 26.1+ ships Java 25 class files and javac cannot
# read class files newer than itself, so those modules need a 25 toolchain — while still emitting
# Java 21 bytecode via --release. Provisioned automatically by the foojay resolver.
javaToolchainModern = "25"

# --- Build plugins --------------------------------------------------------------------------------
paperweight = "2.0.0-SNAPSHOT"
shadow = "9.6.1"
runPaper = "3.1.0"
foojay = "1.0.0"

# --- Compile baseline -----------------------------------------------------------------------------
# api/ and core/ compile against the OLDEST supported Paper API on purpose: reaching for something
# that would be missing on 1.21.4 then fails at compile time instead of crashing a user's server.
paperApi = "1.21.4-R0.1-SNAPSHOT"

# Used ONLY on test runtime classpaths, and only because MockBukkit ships one build per Minecraft
# version and refuses to start against a different one. Tests therefore run against a newer API than
# the code is compiled against, which is the harmless direction: `compileJava` still uses `paperApi`
# above, so reaching for something missing on 1.21.4 is a compile error either way. Bump this to
# whatever the MockBukkit release names when upgrading it.
paperApiTest = "1.21.11-R0.1-SNAPSHOT"

# --- Runtime libraries ----------------------------------------------------------------------------
hikari = "7.1.0"
sqlite = "3.53.4.0"

# JDBC drivers. Never on the compile classpath — nothing in this project references a driver class —
# and never shaded. They are downloaded at runtime by BetterNpcsPluginLoader, and only the one the
# configured backend actually needs. The versions live here so that the catalogue stays the single
# place versions are declared; processResources expands them into betternpcs-libraries.properties.
mysqlDriver = "9.5.0"
mariadbDriver = "3.5.7"
postgresqlDriver = "42.7.9"

# --- Testing --------------------------------------------------------------------------------------
junit = "6.1.3"
assertj = "3.27.7"
archunit = "1.5.0"
# A stand-in Bukkit server for tests. Pinned to the 1.21 line, matching `paperApi`: MockBukkit
# tracks Minecraft versions, and a mismatch shows up as a missing registry rather than as a
# version-conflict message.
mockbukkit = "4.116.3"


[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paperApi" }
paper-api-test = { module = "io.papermc.paper:paper-api", version.ref = "paperApiTest" }

hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite" }

# Versionless on purpose — pinned by the junit-bom platform.
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
mockbukkit = { module = "org.mockbukkit.mockbukkit:mockbukkit-v1.21", version.ref = "mockbukkit" }

# Consumed by buildSrc so the convention plugins can apply paperweight.
paperweight-plugin = { module = "io.papermc.paperweight:paperweight-userdev", version.ref = "paperweight" }


[plugins]
paperweight-userdev = { id = "io.papermc.paperweight.userdev", version.ref = "paperweight" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "runPaper" }
foojay-resolver = { id = "org.gradle.toolchains.foojay-resolver-convention", version.ref = "foojay" }
