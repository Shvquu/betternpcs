name: BetterNPCs
version: '${version}'
main: dev.shvquu.betternpcs.plugin.BetterNpcsPlugin
loader: dev.shvquu.betternpcs.plugin.BetterNpcsPluginLoader
api-version: '1.21'
description: A modern, free NPC plugin with a real public API.
website: https://shvquu.dev/betternpcs
authors:
  - shvquu

# PlaceholderAPI is genuinely optional: BetterNPCs resolves its own placeholders either way, and
# hooks PlaceholderAPI only if it happens to be there.
dependencies:
  server:
    PlaceholderAPI:
      load: BEFORE
      required: false
      join-classpath: false

####################################################################################################
# Permissions
#
# Everything defaults to `op`, so a fresh install grants nothing to ordinary players.
#
# `betternpcs.command` gates /npc as a whole. Brigadier hides nodes whose permission check fails, so
# a player without it does not see the command in tab completion at all.
#
# `betternpcs.command.action.console` is deliberately NOT a child of `betternpcs.command.action`. A
# console action runs with full server permissions, so an NPC carrying one is as powerful as whoever
# configured it — being trusted to edit NPC actions is not the same as being trusted with /op.
# It IS a child of `betternpcs.admin`, because that node means exactly that.
####################################################################################################
permissions:
  betternpcs.admin:
    description: Grants every BetterNPCs permission.
    default: op
    children:
      betternpcs.command: true
      betternpcs.command.create: true
      betternpcs.command.remove: true
      betternpcs.command.list: true
      betternpcs.command.info: true
      betternpcs.command.spawn: true
      betternpcs.command.teleport: true
      betternpcs.command.move: true
      betternpcs.command.edit: true
      betternpcs.command.action: true
      betternpcs.command.action.console: true
      betternpcs.command.reload: true
      betternpcs.command.save: true

  betternpcs.command:
    description: Use /npc at all. Without it the command is not even offered in tab completion.
    default: op

  betternpcs.command.create:
    description: Create NPCs.
    default: op

  betternpcs.command.remove:
    description: Delete NPCs.
    default: op

  betternpcs.command.list:
    description: List NPCs.
    default: op

  betternpcs.command.info:
    description: Inspect an NPC.
    default: op

  betternpcs.command.spawn:
    description: Spawn and despawn NPCs.
    default: op

  betternpcs.command.teleport:
    description: Teleport yourself to an NPC.
    default: op

  betternpcs.command.move:
    description: Move an NPC to where you are standing.
    default: op

  betternpcs.command.edit:
    description: Change an NPC's name, type, skin or equipment.
    default: op

  betternpcs.command.action:
    description: Change an NPC's actions.
    default: op

  betternpcs.command.action.console:
    description: >-
      Add a console action, which runs with full server permissions. Not implied by
      betternpcs.command.action.
    default: op

  betternpcs.command.reload:
    description: Reload the configuration, languages and NPCs.
    default: op

  betternpcs.command.save:
    description: Force a save of every changed NPC.
    default: op
