####################################################################################################
# Maven coordinates of the libraries BetterNPCs downloads at runtime.
#
# Generated at build time from gradle/libs.versions.toml — do not edit the versions here, they will
# be overwritten. Read by BetterNpcsPluginLoader.
#
# These are not shaded into the jar on purpose: relocating a JDBC driver breaks the SQLite one,
# which resolves its native methods by fully qualified class name.
####################################################################################################

hikaricp=com.zaxxer:HikariCP:${hikariVersion}
sqlite=org.xerial:sqlite-jdbc:${sqliteVersion}
mysql=com.mysql:mysql-connector-j:${mysqlVersion}
mariadb=org.mariadb.jdbc:mariadb-java-client:${mariadbVersion}
postgresql=org.postgresql:postgresql:${postgresqlVersion}
mongodb=org.mongodb:mongodb-driver-sync:${mongodbVersion}
