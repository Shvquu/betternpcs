####################################################################################################
# BetterNPCs — Español (es_ES)
#
# Cada valor es MiniMessage: https://docs.advntr.dev/minimessage/format.html
#
# El texto entre corchetes angulares como <npc> es un marcador que BetterNPCs rellena. Encima de
# cada línea se indica cuáles acepta. Un marcador desconocido se deja como texto literal en lugar de
# vaciarse, de modo que una errata resulta visible en vez de comerse parte del mensaje.
#
# Los valores de los marcadores siempre se insertan como texto plano. Un jugador cuyo nombre
# contenga algo con forma de etiqueta no puede inyectar formato ni un comando pulsable en un mensaje
# que vean otros jugadores.
#
# Borrar una línea es seguro: BetterNPCs usa su texto inglés interno y lo indica una vez al
# arrancar.
####################################################################################################

prefix: "<gradient:#00c6ff:#0072ff><bold>BetterNPCs</bold></gradient> <dark_gray>»</dark_gray> "

general:
  # <permission>
  no-permission: "<red>No tienes permiso para hacer eso."
  players-only: "<red>Solo un jugador puede ejecutar esto."
  # <input>
  unknown-subcommand: "<red>Subcomando desconocido '<white><input></white>'. Prueba <white>/npc help</white>."
  # <input>
  invalid-number: "<red>'<white><input></white>' no es un número."
  # <world>
  unknown-world: "<red>El mundo '<white><world></white>' no está cargado."
  help-header: "<gray>Comandos de BetterNPCs <dark_gray>(solo los que puedes usar)"
  # <usage>
  help-entry: "<dark_gray> <white><usage>"
  # <error>
  storage-error: "<red>La consulta a la base de datos ha fallado. Consulta la consola."
  # <count> <millis>
  reload-success: "<green>Se han recargado <white><count></white> NPCs en <white><millis></white> ms."
  # <error>
  reload-failed: "<red>La recarga ha fallado: <white><error></white>"

npc:
  # <npc> <type>
  created: "<green>NPC <white><npc></white> <gray>(<type>)</gray> creado."
  # <npc>
  deleted: "<green>NPC <white><npc></white> eliminado."
  # <npc>
  delete-cancelled: "<red>Otro plugin ha impedido eliminar <white><npc></white>."
  # <npc>
  not-found: "<red>No existe ningún NPC llamado <white><npc></white>."
  # <npc>
  name-taken: "<red>Ya existe un NPC llamado <white><npc></white>."
  # <npc>
  name-invalid: "<red>'<white><npc></white>' no es un nombre de NPC válido. Usa letras, dígitos, '_' y '-'."
  no-target: "<red>Mira a un NPC o indica su nombre."
  # <npc>
  spawned: "<green><white><npc></white> ha aparecido."
  # <npc>
  despawned: "<green><white><npc></white> ha desaparecido."
  # <npc>
  already-spawned: "<yellow><npc> ya está apareciendo."
  # <npc>
  already-despawned: "<yellow><npc> no está apareciendo."
  # <npc>
  spawn-cancelled: "<red>Otro plugin ha impedido que aparezca <white><npc></white>."
  # <npc> <world> <x> <y> <z>
  teleported: "<green><white><npc></white> movido a <white><x>, <y>, <z></white> en <white><world></white>."
  # <npc>
  teleported-to-you: "<green><white><npc></white> movido hasta ti."
  # <npc>
  you-teleported: "<green>Te has teletransportado hasta <white><npc></white>."
  # <old> <new>
  renamed: "<green><white><old></white> renombrado a <white><new></white>."
  # <npc> <name>
  display-name-set: "<green>El nombre visible de <white><npc></white> ahora es <reset><name></reset><green>."
  # <npc>
  display-name-cleared: "<green>Nombre visible de <white><npc></white> restablecido."
  # <npc> <type>
  type-set: "<green><npc> ahora es un <white><type></white>."
  # <input>
  type-unknown: "<red>'<white><input></white>' no es un tipo de NPC válido."
  # <npc>
  saved: "<green><white><npc></white> guardado."
  # <count>
  saved-all: "<green>Se han guardado <white><count></white> NPCs."

  skin:
    # <npc> <skin>
    loading: "<gray>Obteniendo la piel de <white><skin></white> …"
    # <npc> <skin>
    set: "<green><npc> ahora lleva la piel de <white><skin></white>."
    # <npc>
    cleared: "<green>Piel de <white><npc></white> eliminada."
    # <skin> <error>
    failed: "<red>No se ha podido obtener la piel de <white><skin></white>: <white><error></white>"
    # <skin>
    not-found: "<red>No se ha encontrado ninguna piel para <white><skin></white>."
    # <npc>
    only-player-npcs: "<red>Solo los NPCs de tipo jugador tienen piel."

  equipment:
    # <npc> <slot> <item>
    set: "<green><white><item></white> colocado en la ranura <white><slot></white> de <white><npc></white>."
    # <npc> <slot>
    cleared: "<green>Ranura <white><slot></white> de <white><npc></white> vaciada."
    # <input>
    slot-unknown: "<red>'<white><input></white>' no es una ranura de equipamiento."
    hold-item: "<red>Sostén en la mano el objeto que quieras usar."

  action:
    # <npc> <interaction> <action>
    added: "<green><white><action></white> añadida a <white><interaction></white> de <white><npc></white>."
    # <npc> <interaction> <action>
    removed: "<green><white><action></white> eliminada de <white><npc></white>."
    # <npc> <interaction> <count>
    cleared: "<green>Se han eliminado <white><count></white> acciones de <white><npc></white>."
    # <npc> <interaction>
    list-header: "<gray>Acciones de <white><npc></white> para <white><interaction></white>:"
    # <index> <action>
    list-entry: "<dark_gray> <gray><index>. <white><action>"
    # <npc> <interaction>
    list-empty: "<gray><npc> no tiene acciones para <white><interaction></white>."
    # <type> <known>
    type-unknown: "<red>No existe ninguna acción llamada '<white><type></white>'. Conocidas: <white><known></white>"
    # <action> <error>
    invalid: "<red>Esa acción no se puede usar: <white><error></white>"
    # <index>
    index-out-of-range: "<red>No existe la acción número <white><index></white>."
    console-denied: "<red>No puedes añadir acciones de consola. Se ejecutan con permisos totales del servidor."
    # <input>
    interaction-unknown: "<red>'<white><input></white>' no es un tipo de interacción."

  list:
    # <count> <page> <pages>
    header: "<gray>NPCs <dark_gray>(<white><count></white>, página <white><page></white>/<white><pages></white>)"
    # <npc> <type> <world> <state>
    entry: "<dark_gray> <gray><npc> <dark_gray>· <gray><type> <dark_gray>· <gray><world> <dark_gray>· <state>"
    empty: "<gray>Todavía no hay NPCs. Crea uno con <white>/npc create</white>."
    # <page> <pages>
    page-out-of-range: "<red>No existe la página <white><page></white>; hay <white><pages></white>."

  info:
    # <npc>
    header: "<gray>NPC <white><npc></white>"
    # <key> <value>
    line: "<dark_gray> <gray><key><dark_gray>: <white><value>"

  state:
    spawned: "<green>apareciendo"
    despawned: "<gray>sin aparecer"

backup:
  # <count> <file>
  created: "<green>Se han copiado <white><count></white> NPCs a <white><file></white>."
  # <error>
  failed: "<red>No se pudo escribir la copia de seguridad: <white><error></white>"
  # <input>
  name-invalid: "<red>'<white><input></white>' no es un nombre válido para una copia. Usa letras, dígitos, <white>.</white>, <white>-</white> y <white>_</white>."
  # <count>
  list-header: "<gray>Copias de seguridad <dark_gray>(<white><count></white>, la más reciente primero)"
  # <file>
  list-entry: "<dark_gray> <gray><file>"
  list-empty: "<gray>Todavía no hay copias de seguridad. Crea una con <white>/npc backup</white>."
  # <file>
  not-found: "<red>No existe ninguna copia llamada <white><file></white>."
  # <file> <error>
  unreadable: "<red>No se pudo leer <white><file></white>: <white><error></white>"

  restore:
    # <file> <created> <overwritten> <blocked>
    plan-header: "<gray>Restaurar <white><file></white> crearía <white><created></white> NPCs, sobrescribiría <white><overwritten></white> y omitiría <white><blocked></white>."
    # <npc>
    blocked-name-taken: "<dark_gray> <yellow><npc> <gray>· otro NPC ya usa ese nombre"
    # <npc>
    blocked-unusable: "<dark_gray> <yellow><npc> <gray>· ese no es un nombre de NPC válido"
    # <count>
    plan-replace-hint: "<gray><white><count></white> NPCs ya existen y no se han tocado. Añade <white>--replace</white> para sobrescribirlos."
    plan-confirm-hint: "<gray>Todavía no ha cambiado nada. Ejecuta el mismo comando con <white>--confirm</white> para aplicarlo."
    plan-no-changes: "<gray>Restaurar esa copia no cambiaría nada."
    # <created> <overwritten>
    done: "<green>Se han restaurado <white><created></white> NPCs nuevos y <white><overwritten></white> existentes."
    # <count>
    partial: "<yellow><count></yellow> NPCs no se pudieron restaurar; consulta el registro del servidor."

startup:
  # <version> <supported>
  unsupported-version: "<red>Minecraft <white><version></white> no es compatible. Esta versión admite <white><supported></white>."
  # <current> <latest> <url>
  update-available: "<yellow>Ya está disponible BetterNPCs <white><latest></white>; estás usando <white><current></white>. Descarga: <white><url></white>"
